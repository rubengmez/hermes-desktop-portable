# Portable Windows build of Hermes Desktop, compiled from the LATEST OFFICIAL
# RELEASE of NousResearch/hermes-agent.
#
# Contract:
#   - One release here per upstream release. Nothing is built unless upstream
#     publishes a version we have not published yet (same tag AND same commit).
#     The dedupe check reads `releases/tags/<tag>` directly — never
#     `releases?per_page=1`, which is ordered by created_at and is not "newest".
#   - The packaged app carries the real upstream version (electron-builder
#     extraMetadata.version), so Help → About shows e.g. 0.22.5 instead of the
#     0.0.0 placeholder that both package.json files carry in the upstream tree.
#   - The release body records the upstream commit, and that marker is what the
#     next run compares against (a moved/retagged upstream tag force-rebuilds).
#
# Triggers:
#   - daily (cron): detect a new upstream release
#   - manual: same detection, plus an optional force rebuild
#
# Releases are created on the repo where this workflow runs.

name: Hermes Desktop Windows (portable)

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if this upstream version is already published here'
        type: boolean
        default: false
  schedule:
    - cron: '5 5 * * *'   # every day 05:05 UTC — cheap check, build only on a new version

permissions:
  contents: write          # publish the GitHub Release

concurrency:
  group: hermes-desktop-win
  cancel-in-progress: true

env:
  UPSTREAM_REPO: NousResearch/hermes-agent

jobs:
  # ─── Check: latest upstream release vs what this repo already published ──
  check-release:
    name: Check latest official release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag:         ${{ steps.detect.outputs.tag }}
      version:     ${{ steps.detect.outputs.version }}
      name:        ${{ steps.detect.outputs.name }}
      commit:      ${{ steps.detect.outputs.commit }}
      published:   ${{ steps.detect.outputs.published }}
      needs_build: ${{ steps.detect.outputs.needs_build }}
    steps:
      - name: Detect new upstream release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          api() { curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "$@"; }

          # 1. Latest published (non-draft, non-prerelease) upstream release.
          rel=$(api "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")
          TAG=$(jq -r '.tag_name' <<<"$rel")
          NAME=$(jq -r '.name // .tag_name' <<<"$rel")
          VERSION="${TAG#v}"
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::could not read upstream release tag"; exit 1; }

          # 2. The exact commit that tag points at (annotated tag → deref once).
          ref=$(api "https://api.github.com/repos/${UPSTREAM_REPO}/git/ref/tags/${TAG}")
          sha=$(jq -r '.object.sha' <<<"$ref")
          if [ "$(jq -r '.object.type' <<<"$ref")" = "tag" ]; then
            sha=$(api "https://api.github.com/repos/${UPSTREAM_REPO}/git/tags/${sha}" | jq -r '.object.sha')
          fi

          # 3. Have we already published THIS tag at THIS commit, with a zip?
          NEEDS_BUILD=true
          PUBLISHED=''
          if existing=$(api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>/dev/null); then
            PUBLISHED=$(jq -r '
              [ .assets[] | select(.name | endswith(".zip")) | select(.size > 1000000) ] | length
            ' <<<"$existing")
            if [ "${PUBLISHED:-0}" -gt 0 ] \
               && grep -q "upstream-commit: ${sha}" <<<"$(jq -r '.body // ""' <<<"$existing")"; then
              NEEDS_BUILD=false
            fi
          fi

          if [ "${FORCE:-false}" = "true" ]; then NEEDS_BUILD=true; fi

          echo "upstream: ${TAG} (${NAME}) @ ${sha}"
          echo "already published here: ${PUBLISHED:-0} zip asset(s) → needs_build=${NEEDS_BUILD}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "commit=${sha}"
            echo "published=${PUBLISHED:-0}"
            echo "needs_build=${NEEDS_BUILD}"
          } >> "$GITHUB_OUTPUT"

  # ─── Build: compile the exact upstream release tag ───────────────────────
  build-desktop-win:
    name: Build Hermes Desktop (win x64)
    needs: check-release
    if: needs.check-release.outputs.needs_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      UPSTREAM_TAG: ${{ needs.check-release.outputs.tag }}
      VERSION:      ${{ needs.check-release.outputs.version }}
      # Recorded as displayVersion in resources/install-stamp.json: provenance
      # only (no release feed is staged — HERMES_PAYLOAD_TAG stays unset).
      HERMES_PAYLOAD_VERSION: ${{ needs.check-release.outputs.version }}
      # Remote-only ("lite") client: no local agent, no self-update feed.
      # NOTE: with the default (non-light) variant the stamp payload is
      # "bootstrap" and the About panel prefers the *gateway* version over the
      # build's own — that is how a brand-new download can report an old number.
      HERMES_DESKTOP_VARIANT: light

    steps:
      - name: Checkout upstream release tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check-release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Align npm to line 12 (same as official CI)
        run: |
          npm --version | Select-String '^12\.' -Quiet
          if (-not $LASTEXITCODE) { npm i -g npm@12 }

      - name: Install workspace dependencies
        run: npm ci

      # ── Build the desktop GUI (portable, no agent payload) ───────────────
      - name: Build desktop app (vite + electron)
        working-directory: apps/desktop
        run: npm run build

      - name: Package portable app
        working-directory: apps/desktop
        # extraMetadata.version is the sanctioned override (upstream's own
        # release pipeline passes the same flag); package.json in the upstream
        # tree is a 0.0.0 placeholder, which is why an unstamped build reports
        # 0.0.0 in Help → About.
        run: npm run builder -- --dir --publish never "-c.extraMetadata.version=$env:VERSION"

      - name: Assert packaged version
        working-directory: apps/desktop/release/win-unpacked
        shell: pwsh
        run: |
          $exe = Get-ChildItem *.exe | Sort-Object Length -Descending | Select-Object -First 1
          $v = $exe.VersionInfo
          "packaged exe: $($exe.Name) FileVersion=$($v.FileVersion) ProductVersion=$($v.ProductVersion)"
          if ($v.FileVersion -notlike "$env:VERSION*") {
            throw "packaged version '$($v.FileVersion)' does not match upstream '$env:VERSION'"
          }

      - name: Zip portable app
        working-directory: apps/desktop/release
        shell: pwsh
        run: |
          $zip = "Hermes-desktop-portable-win-x64-$env:VERSION.zip"
          Compress-Archive -Path win-unpacked -DestinationPath $zip -Force
          "zip: $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 1)) MB)"
          "ASSET_NAME=$zip" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.check-release.outputs.tag }}
          name: ${{ needs.check-release.outputs.name }} (portable build)
          overwrite_files: true
          generate_release_notes: false
          draft: false
          prerelease: false
          body: |
            Portable Windows build of **Hermes Agent ${{ needs.check-release.outputs.version }}**,
            compiled from upstream `${{ env.UPSTREAM_REPO }}` @ `${{ needs.check-release.outputs.tag }}`.

            <!-- upstream-commit: ${{ needs.check-release.outputs.commit }} -->

            | | |
            |---|---|
            | Upstream version | `${{ needs.check-release.outputs.version }}` |
            | Upstream commit | `${{ needs.check-release.outputs.commit }}` |
            | Variant | lite client (`HERMES_DESKTOP_VARIANT=light`) — GUI only, no local agent |
            | Asset | `${{ env.ASSET_NAME }}` |
            | Built in Actions | run #${{ github.run_number }} |

            **What you get:** extract the zip anywhere and run the `Hermes*.exe` inside. No
            installer, no local agent. Point it at a remote backend with
            **Settings → Gateways → Remote gateway** (or `HERMES_DESKTOP_REMOTE_URL`).

            **Update check:** the app shows its own version in **Help → About** — it must match
            `${{ needs.check-release.outputs.version }}`. If it shows anything else, you are
            running an older download.

            **Unsigned:** SmartScreen may warn on first run (More info → Run anyway).
            Not affiliated with Nous Research; see the repo README.
          files: apps/desktop/release/${{ env.ASSET_NAME }}

      - name: Summary
        shell: pwsh
        run: |
          "Built $env:UPSTREAM_TAG (version $env:VERSION) → $env:ASSET_NAME" >> $env:GITHUB_STEP_SUMMARY
